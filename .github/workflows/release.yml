name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build single-file Windows executable
        shell: powershell
        run: ./build.ps1
      - name: Test mixer, interactions and pixel-exact UI
        shell: powershell
        run: ./test.ps1
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish_release.ps1
    permissions:
      contents: write
